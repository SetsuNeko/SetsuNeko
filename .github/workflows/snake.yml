name: Generate Snake

on:
  # 每天自动运行一次 (UTC时间 00:00)
  schedule:
    - cron: "0 0 * * *"
  # 允许手动点击运行
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          # 你的 GitHub 用户名
          github_user_name: SetsuNeko
          # 生成的图片输出路径
          outputs: |
            dist/snake.svg?palette=github-dark
            dist/snake.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
      # 将生成的图片推送到 output 分支
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
