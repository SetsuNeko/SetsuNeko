name: Generate Snake

on:
  # 每天自动运行一次 (UTC时间 00:00)
  schedule:
    - cron: "0 0 * * *"
  # 每次你提交代码时也自动运行
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          # 你的 GitHub 用户名
          github_user_name: SetsuNeko
          # 生成的图片输出路径
          outputs: |
            dist/snake.svg?palette=github-dark
            dist/snake.gif?color_snake=hotpink&color_dots=#ffc0cb,#ffb6c1,#ff69b4,#ff1493
          
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
